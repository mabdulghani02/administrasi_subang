<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>Keuangan & SDM - RM Tahu Sumedang Subang</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="mobile-header">
  <div style="font-weight: 800; font-size: 16px;">KEUANGAN SUBANG</div>
  <button class="hamburger-btn" onclick="toggleSidebar()">☰ Menu</button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div>KEUANGAN SUBANG<small>Rumah Makan Tahu Sumedang</small></div>
      <button style="background:transparent; border:0; color:#94a3b8; font-size:24px; cursor:pointer;" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </button>
      <button data-page="sales" onclick="showPage('sales')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Pendapatan
      </button>
      <button data-page="expense" onclick="showPage('expense')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Pengeluaran
      </button>
      <button data-page="advances" onclick="showPage('advances')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Kasbon
      </button>
      <button data-page="attendance" onclick="showPage('attendance')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Absensi
      </button>
      <button data-page="payroll" onclick="showPage('payroll')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Daftar Gaji
      </button>
    </div>
  </aside>

  <main class="main"><div id="content"></div></main>
</div>

<div id="toast" class="toast"></div>

<script>
  const SUPABASE_URL = 'https://grlaiyobzuhoxpofqhrb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_JfhWw06jtowD1Af22vfUxA__d_MB';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let DB = { sales: [], expenses: [], advances: [], attendance: [], masterSalary: [] };

  function toggleSidebar() {
    document.getElementById('appSidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
  }

  const $ = id => document.getElementById(id);
  function money(v) { return 'Rp ' + Number(v || 0).toLocaleString('id-ID'); }
  function today() { return new Date().toISOString().slice(0, 10); }

  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  async function loadData(targetPage = 'dashboard') {
    showToast('Memuat data dari Cloud...');
    try {
      const [sRes, eRes, aRes, attRes, mRes] = await Promise.all([
        _supabase.from('sales').select('*').order('tanggal', { ascending: false }),
        _supabase.from('expenses').select('*').order('tanggal', { ascending: false }),
        _supabase.from('advances').select('*').order('tanggal', { ascending: false }),
        _supabase.from('attendance').select('*').order('tanggal', { ascending: false }),
        _supabase.from('master_salary').select('*')
      ]);

      DB.sales = sRes.data || [];
      DB.expenses = eRes.data || [];
      DB.advances = aRes.data || [];
      DB.attendance = attRes.data || [];
      DB.masterSalary = mRes.data || [];

      showPage(targetPage);
    } catch (err) {
      showToast('Gagal memuat data dari server.');
    }
  }

  function showPage(page) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    $('appSidebar').classList.remove('open');
    $('sidebarOverlay').classList.remove('active');

    if (page === 'dashboard') renderDashboard();
    if (page === 'sales') renderSales();
    if (page === 'expense') renderExpense();
    if (page === 'advances') renderAdvances();
    if (page === 'attendance') renderAttendance();
    if (page === 'payroll') renderPayroll();
  }

  function renderDashboard() {
    const d = today();
    const expToday = DB.expenses.filter(r => r.tanggal === d);
    const advToday = DB.advances.filter(r => r.tanggal === d);
    const totalExp = expToday.reduce((sum, r) => sum + Number(r.nominal || 0), 0);
    const totalAdv = advToday.reduce((sum, r) => sum + Number(r.nominal || 0), 0);

    $('content').innerHTML = `
      <div class="top">
        <div class="title">Dashboard Keuangan</div>
        <div class="subtitle">Unit Subang - Cloud Connected</div>
      </div>
      <div class="cards">
        <div class="card card-danger">
          <div class="card-label">Pengeluaran Hari Ini</div>
          <div class="card-value">${money(totalExp)}</div>
        </div>
        <div class="card card-orange">
          <div class="card-label">Kasbon Hari Ini</div>
          <div class="card-value">${money(totalAdv)}</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Menu Operasional</div>
        <div style="display:grid; gap:10px;">
          <button class="btn btn-primary" onclick="showPage('sales')">Kelola Pendapatan</button>
          <button class="btn btn-secondary" onclick="showPage('expense')">Kelola Pengeluaran</button>
          <button class="btn btn-secondary" onclick="showPage('advances')">Kelola Kasbon</button>
          <button class="btn btn-secondary" onclick="showPage('attendance')">Kelola Absensi</button>
          <button class="btn btn-secondary" onclick="showPage('payroll')">Daftar Gaji & Rekap</button>
        </div>
      </div>
    `;
  }

  function renderSales() {
    const list = DB.sales;
    $('content').innerHTML = `
      <div class="top"><div class="title">Pendapatan Harian</div></div>
      <div class="panel">
        <form id="salesForm">
          <div class="form-grid">
            <div class="field"><label>Tanggal</label><input type="date" name="tanggal" value="${today()}" required></div>
            <div class="field"><label>Makanan (Rp)</label><input type="number" name="makanan" value="0" required></div>
            <div class="field"><label>Minuman (Rp)</label><input type="number" name="minuman" value="0" required></div>
            <div class="field"><label>Tahu (Rp)</label><input type="number" name="tahu" value="0" required></div>
            <div class="field"><label>Cash (Rp)</label><input type="number" name="cash" value="0" required></div>
          </div>
          <div class="actions"><button class="btn btn-primary" type="submit">Simpan Pendapatan</button></div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-title">Riwayat Pendapatan</div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Tanggal</th><th class="right">Makanan</th><th class="right">Minuman</th><th class="right">Tahu</th><th class="right">Cash</th></tr></thead>
            <tbody>
              ${list.length ? list.map(r => `<tr><td>${r.tanggal}</td><td class="right">${money(r.makanan)}</td><td class="right">${money(r.minuman)}</td><td class="right">${money(r.tahu)}</td><td class="right">${money(r.cash)}</td></tr>`).join('') : `<tr><td colspan="5" class="empty">Belum ada data pendapatan.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('salesForm').onsubmit = async e => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      const { error } = await _supabase.from('sales').insert([formData]);
      if (error) showToast('Gagal: ' + error.message);
      else { showToast('Pendapatan tersimpan!'); loadData('sales'); }
    };
  }

  function renderExpense() {
    const list = DB.expenses;
    $('content').innerHTML = `
      <div class="top"><div class="title">Pengeluaran Operasional</div></div>
      <div class="panel">
        <form id="expForm">
          <div class="form-grid">
            <div class="field"><label>Tanggal</label><input type="date" name="tanggal" value="${today()}" required></div>
            <div class="field"><label>Sumber / Keperluan</label><input type="text" name="sumber" placeholder="Contoh: Gas LPG" required></div>
            <div class="field"><label>Nominal (Rp)</label><input type="number" name="nominal" placeholder="0" required></div>
            <div class="field"><label>Keterangan</label><input type="text" name="keterangan" placeholder="-"></div>
          </div>
          <div class="actions"><button class="btn btn-primary" type="submit">Simpan Pengeluaran</button></div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-title">Riwayat Pengeluaran</div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Tanggal</th><th>Sumber</th><th class="right">Nominal</th><th>Keterangan</th></tr></thead>
            <tbody>
              ${list.length ? list.map(r => `<tr><td>${r.tanggal}</td><td><b>${r.sumber}</b></td><td class="right">${money(r.nominal)}</td><td>${r.keterangan || '-'}</td></tr>`).join('') : `<tr><td colspan="4" class="empty">Belum ada data pengeluaran.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('expForm').onsubmit = async e => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      const { error } = await _supabase.from('expenses').insert([formData]);
      if (error) showToast('Gagal: ' + error.message);
      else { showToast('Pengeluaran tersimpan!'); loadData('expense'); }
    };
  }

  function renderAdvances() {
    const list = DB.advances;
    $('content').innerHTML = `
      <div class="top"><div class="title">Kasbon Karyawan</div></div>
      <div class="panel">
        <form id="advForm">
          <div class="form-grid">
            <div class="field"><label>Tanggal</label><input type="date" name="tanggal" value="${today()}" required></div>
            <div class="field"><label>Nama Karyawan</label><input type="text" name="nama" placeholder="Nama..." required></div>
            <div class="field"><label>Divisi</label><input type="text" name="departemen" placeholder="Divisi..." required></div>
            <div class="field"><label>Nominal (Rp)</label><input type="number" name="nominal" placeholder="0" required></div>
            <div class="field"><label>Keterangan</label><input type="text" name="keterangan" placeholder="Keperluan..."></div>
          </div>
          <div class="actions"><button class="btn btn-primary" type="submit">Simpan Kasbon</button></div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-title">Riwayat Kasbon</div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Tanggal</th><th>Nama</th><th>Divisi</th><th class="right">Nominal</th></tr></thead>
            <tbody>
              ${list.length ? list.map(r => `<tr><td>${r.tanggal}</td><td><b>${r.nama}</b></td><td><span class="badge badge-dept">${r.departemen}</span></td><td class="right">${money(r.nominal)}</td></tr>`).join('') : `<tr><td colspan="4" class="empty">Belum ada data kasbon.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('advForm').onsubmit = async e => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      const { error } = await _supabase.from('advances').insert([formData]);
      if (error) showToast('Gagal: ' + error.message);
      else { showToast('Kasbon tersimpan!'); loadData('advances'); }
    };
  }

  function renderAttendance() {
    const employees = DB.masterSalary;
    const list = DB.attendance;
    $('content').innerHTML = `
      <div class="top"><div class="title">Absensi Karyawan</div></div>
      <div class="panel">
        <form id="attForm">
          <div class="form-grid">
            <div class="field"><label>Tanggal</label><input type="date" name="tanggal" value="${today()}" required></div>
            <div class="field"><label>Pilih Karyawan</label>
              <select name="nama" required>
                <option value="">-- Pilih Karyawan --</option>
                ${employees.map(emp => `<option value="${emp.nama}">${emp.nama} (${emp.departemen || 'Umum'})</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Status Kehadiran</label>
              <select name="status" required>
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
              </select>
            </div>
          </div>
          <div class="actions"><button class="btn btn-primary" type="submit">Simpan Absensi</button></div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-title">Riwayat Absensi</div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Tanggal</th><th>Nama</th><th>Status</th></tr></thead>
            <tbody>
              ${list.length ? list.map(r => `<tr><td>${r.tanggal}</td><td><b>${r.nama}</b></td><td>${r.status}</td></tr>`).join('') : `<tr><td colspan="3" class="empty">Belum ada data absensi.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('attForm').onsubmit = async e => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      const { error } = await _supabase.from('attendance').insert([formData]);
      if (error) showToast('Gagal: ' + error.message);
      else { showToast('Absensi tersimpan!'); loadData('attendance'); }
    };
  }

  function renderPayroll() {
    const list = DB.masterSalary;
    $('content').innerHTML = `
      <div class="top"><div class="title">Daftar Gaji Karyawan</div></div>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Nama</th><th>Divisi</th><th class="right">Gaji Pokok</th></tr></thead>
            <tbody>
              ${list.length ? list.map(r => `<tr><td><b>${r.nama}</b></td><td><span class="badge badge-dept">${r.departemen || '-'}</span></td><td class="right">${money(r.gaji_pokok)}</td></tr>`).join('') : `<tr><td colspan="3" class="empty">Belum ada data master gaji di Supabase.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  loadData();
</script>

</body>
</html>
