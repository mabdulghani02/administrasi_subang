<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>Administrasi Subang - Sari Kedele</title>

  <!-- Penambahan Kode Manifes dan Ikon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Admin+Subang&background=121212&color=20c997&size=192">

  <link rel="stylesheet" href="style.css?v=1.8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Tambahan Library ExcelJS untuk Export Laporan Bulanan -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>

<body>

<div class="mobile-header">
  <div class="mobile-header-title">ADMINISTRASI SUBANG</div>
  <div style="display: flex; gap: 8px; align-items: center;">
    <button class="theme-toggle-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
    <!-- Tombol menu diubah menjadi ikon hamburger saja tanpa teks "Menu" -->
    <button class="hamburger-btn" onclick="toggleSidebar()" style="padding: 8px 10px; border-radius: 8px;"><i class="fa-solid fa-bars"></i></button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div>
        ADMINISTRASI SUBANG
        <small>Sari Kedele - Subang</small>
      </div>
      <button style="background:transparent; border:0; color:inherit; font-size:22px; cursor:pointer;" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')"><i class="fa-solid fa-house"></i> Dashboard</button>
      <button data-page="sales" onclick="showPage('sales')"><i class="fa-solid fa-wallet"></i> Pendapatan</button>
      <button data-page="expense" onclick="showPage('expense')"><i class="fa-solid fa-receipt"></i> Pengeluaran</button>
      <button data-page="attendance" onclick="showPage('attendance')"><i class="fa-solid fa-user-clock"></i> Absensi</button>
      <button data-page="payroll" onclick="showPage('payroll')"><i class="fa-solid fa-file-invoice-dollar"></i> Daftar Gaji</button>
      <button data-page="limbah" onclick="showPage('limbah')"><i class="fa-solid fa-recycle"></i> Penjualan Limbah</button>
      <button data-page="aichat" onclick="showPage('aichat')"><i class="fa-solid fa-robot"></i> Asisten AI</button>
      <button data-page="settings" onclick="showPage('settings')"><i class="fa-solid fa-gear"></i> Pengaturan</button>
    </div>
  </aside>

  <main class="main">
    <div id="content"></div>
  </main>
</div>

<!-- BOTTOM NAVIGATION BAR (Dirapikan & ditambah menu AI Chat) -->
<nav class="bottom-nav" style="display: flex; justify-content: space-around; align-items: center; padding: 4px 2px;">
  <button class="b-nav-btn" data-page="dashboard" onclick="showPage('dashboard')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-house" style="font-size: 15px;"></i><span>Home</span>
  </button>
  <button class="b-nav-btn" data-page="sales" onclick="showPage('sales')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-wallet" style="font-size: 15px;"></i><span>Pendapatan</span>
  </button>
  <button class="b-nav-btn" data-page="expense" onclick="showPage('expense')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-receipt" style="font-size: 15px;"></i><span>Pengeluaran</span>
  </button>
  <button class="b-nav-btn" data-page="attendance" onclick="showPage('attendance')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-user-clock" style="font-size: 15px;"></i><span>Absensi</span>
  </button>
  <button class="b-nav-btn" data-page="payroll" onclick="showPage('payroll')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-file-invoice-dollar" style="font-size: 15px;"></i><span>Gaji</span>
  </button>
  <button class="b-nav-btn" data-page="aichat" onclick="showPage('aichat')" style="flex: 1; padding: 6px 2px; font-size: 11px;">
    <i class="fa-solid fa-robot" style="font-size: 15px;"></i><span>AI Chat</span>
  </button>
</nav>

<div id="toast" class="toast"></div>

<!-- PEMANGGILAN SCRIPT UTAMA -->
<script src="app.js?v=1.8"></script>
  
<!-- Skrip Pendaftaran Pekerja Layanan -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</body>
</html>
