<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>Administrasi Subang - Sari Kedele</title>

  <!-- Manifes & Ikon PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=AS&background=121212&color=20c997&size=192">

  <link rel="stylesheet" href="style.css?v=2.1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>

<body>

<div class="mobile-header">
  <div style="display: flex; align-items: center; gap: 10px;">
    <!-- Logo Modern Pengganti Teks AS Biasa -->
    <div class="app-brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#paint0_linear)" />
        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="paint0_linear" x1="2" y1="2" x2="22" y2="12" gradientUnits="userSpaceOnUse">
            <stop stop-color="#007aff"/>
            <stop offset="1" stop-color="#5ac8fa"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="mobile-header-title">ADMINISTRASI SUBANG</div>
  </div>
  <div style="display: flex; gap: 8px; align-items: center;">
    <button class="theme-toggle-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
    <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="app-brand-logo" style="width:32px; height:32px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#007aff"/></svg>
        </div>
        <div>
          ADMINISTRASI SUBANG
          <small>Sari Kedele - Subang</small>
        </div>
      </div>
      <button style="background:transparent; border:0; color:inherit; font-size:22px; cursor:pointer;" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')"><i class="fa-solid fa-house"></i> Dashboard</button>
      <button data-page="sales" onclick="showPage('sales')"><i class="fa-solid fa-wallet"></i> Pendapatan</button>
      <button data-page="expense" onclick="showPage('expense')"><i class="fa-solid fa-receipt"></i> Pengeluaran</button>
      <button data-page="attendance" onclick="showPage('attendance')"><i class="fa-solid fa-user-clock"></i> Absensi</button>
      <button data-page="payroll" onclick="showPage('payroll')"><i class="fa-solid fa-file-invoice-dollar"></i> Daftar Gaji</button>
      <button data-page="limbah" onclick="showPage('limbah')"><i class="fa-solid fa-recycle"></i> Penjualan Limbah</button>
      <button data-page="aichat" onclick="showPage('aichat')"><i class="fa-solid fa-wand-magic-sparkles"></i> Asisten AI</button>
      <button data-page="settings" onclick="showPage('settings')"><i class="fa-solid fa-gear"></i> Pengaturan</button>
    </div>
  </aside>

  <main class="main">
    <div id="content"></div>
  </main>
</div>

<!-- TOMBOL MELAYANG ASISTEN AI (FLOATING ACTION BUTTON) -->
<button class="ai-floating-fab" onclick="showPage('aichat')" title="Asisten AI Gemini">
  <i class="fa-solid fa-wand-magic-sparkles"></i>
</button>

<!-- BILAH NAVIGASI BAWAH (Hanya 5 Menu Utama Berupa Ikon Tanpa Teks) -->
<nav class="bottom-nav">
  <button class="b-nav-btn" data-page="dashboard" onclick="showPage('dashboard')" title="Dashboard">
    <i class="fa-solid fa-house"></i>
  </button>
  <button class="b-nav-btn" data-page="sales" onclick="showPage('sales')" title="Pendapatan">
    <i class="fa-solid fa-wallet"></i>
  </button>
  <button class="b-nav-btn" data-page="expense" onclick="showPage('expense')" title="Pengeluaran">
    <i class="fa-solid fa-receipt"></i>
  </button>
  <button class="b-nav-btn" data-page="attendance" onclick="showPage('attendance')" title="Absensi">
    <i class="fa-solid fa-user-clock"></i>
  </button>
  <button class="b-nav-btn" data-page="payroll" onclick="showPage('payroll')" title="Gaji">
    <i class="fa-solid fa-file-invoice-dollar"></i>
  </button>
</nav>

<div id="toast" class="toast"></div>

<!-- PEMANGGILAN SCRIPT UTAMA MODULE -->
<script type="module" src="app.js?v=2.1"></script>
  
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</body>
</html>
