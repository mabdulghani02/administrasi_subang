<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>Keuangan & SDM - RM Tahu Sumedang Subang</title>

  <link rel="stylesheet" href="style.css">

  <!-- PUSTAKA PENDUKUNG (SUPABASE, HTML2CANVAS, SHEETJS, JSPDF, CHART.JS) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="mobile-header">
  <div style="font-weight: 800; font-size: 15px; letter-spacing: 0.5px;">KEUANGAN SUBANG</div>
  <button class="hamburger-btn" onclick="toggleSidebar()">☰ Menu Navigasi</button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div>
        KEUANGAN SUBANG
        <small>Rumah Makan Tahu Sumedang</small>
      </div>
      <button style="background:transparent; border:0; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')">🏠 Dashboard</button>
      <button data-page="sales" onclick="showPage('sales')">💰 Pendapatan</button>
      <button data-page="expense" onclick="showPage('expense')">💸 Pengeluaran</button>
      <button data-page="attendance" onclick="showPage('attendance')">🕒 Absensi</button>
      <button data-page="payroll" onclick="showPage('payroll')">📑 Daftar Gaji</button>
    </div>
  </aside>

  <main class="main">
    <div id="content"></div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

</body>
</html>
