<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>AS - Administrasi Subang</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Versi 3.3 memaksa peramban membuang memori lama / cache -->
  <link rel="stylesheet" href="style.css?v=3.3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts untuk aksara sambung tipis dan artistik (Parisienne) -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>

<body>

<div class="mobile-header">
  <div class="mobile-header-title" style="display: flex; align-items: center; gap: 10px;">
    <!-- Logo Header Atas diset ke 40px -->
    <img src="logo.png" alt="Logo" style="height: 40px; width: 40px; border-radius: 6px; object-fit: contain;">
    <span style="font-family: 'Parisienne', cursive; font-size: 22px; font-weight: normal; color: var(--text);">Administrasi Subang</span>
  </div>
  <div style="display: flex; gap: 12px; align-items: center;">
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
      <i id="themeIcon" class="fa-solid fa-moon"></i>
    </button>
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Buka Menu">
      <i class="fa-solid fa-bars-staggered"></i>
    </button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <div style="display: flex; align-items: center; gap: 14px;">
        <!-- Logo Sidebar diset ke 56px -->
        <img src="logo.png" alt="Logo" style="height: 56px; width: 56px; border-radius: 10px; object-fit: contain;">
        <div>
          AS - SARI KEDELE
          <small>Administrasi Pintar</small>
        </div>
      </div>
      <button style="background:transparent; border:0; color:inherit; font-size:22px; cursor:pointer;" onclick="toggleSidebar()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="nav">
      <button data-page="dashboard" onclick="showPage('dashboard')"><i class="fa-solid fa-layer-group"></i> Dashboard</button>
      <button data-page="sales" onclick="showPage('sales')"><i class="fa-solid fa-arrow-trend-up"></i> Pendapatan</button>
      <button data-page="expense" onclick="showPage('expense')"><i class="fa-solid fa-arrow-trend-down"></i> Pengeluaran Utama</button>
      <button data-page="expense_tracker" onclick="showPage('expense_tracker')"><i class="fa-solid fa-money-bill-transfer"></i> Pantau Pengeluaran</button>
      <button data-page="laporan_harian" onclick="showPage('laporan_harian')"><i class="fa-brands fa-whatsapp"></i> Laporan Harian</button>
      <button data-page="attendance" onclick="showPage('attendance')"><i class="fa-solid fa-fingerprint"></i> Absensi</button>
      <button data-page="payroll" onclick="showPage('payroll')"><i class="fa-solid fa-wallet"></i> Daftar Gaji</button>
      <button data-page="limbah" onclick="showPage('limbah')"><i class="fa-solid fa-recycle"></i> Penjualan Limbah</button>
      <button data-page="settings" onclick="showPage('settings')"><i class="fa-solid fa-sliders"></i> Pengaturan Sistem</button>
      <button data-page="export_excel" onclick="showPage('export_excel')"><i class="fa-solid fa-file-excel"></i> Ekspor Laporan Excel</button>
    </div>
  </aside>

  <main class="main">
    <div id="content" class="page-transition"></div>
  </main>
</div>

<nav class="bottom-nav">
  <button class="b-nav-btn" data-page="dashboard" onclick="showPage('dashboard')" aria-label="Dashboard">
    <i class="fa-solid fa-layer-group"></i>
  </button>
  <button class="b-nav-btn" data-page="sales" onclick="showPage('sales')" aria-label="Pendapatan">
    <i class="fa-solid fa-arrow-trend-up"></i>
  </button>
  <button class="b-nav-btn" data-page="expense" onclick="showPage('expense')" aria-label="Pengeluaran">
    <i class="fa-solid fa-arrow-trend-down"></i>
  </button>
  <button class="b-nav-btn" data-page="laporan_harian" onclick="showPage('laporan_harian')" aria-label="Laporan Harian">
    <i class="fa-brands fa-whatsapp"></i>
  </button>
  <button class="b-nav-btn" data-page="attendance" onclick="showPage('attendance')" aria-label="Absensi">
    <i class="fa-solid fa-fingerprint"></i>
  </button>
  <button class="b-nav-btn" data-page="payroll" onclick="showPage('payroll')" aria-label="Gaji">
    <i class="fa-solid fa-wallet"></i>
  </button>
</nav>

<button class="fab-ai" onclick="showPage('aichat')" aria-label="Buka Asisten AI">
  <i class="fa-solid fa-wand-magic-sparkles"></i>
</button>

<div id="toast" class="toast"></div>

<script src="app.js?v=3.3"></script>
<!-- Fitur tambahan pengeluaran (auto-suggest, harga janggal, import Excel, draft). Harus SETELAH app.js -->
<script src="fitur_pengeluaran.js?v=1.0"></script>
<!-- Halaman Laporan Harian (bagikan ke WhatsApp). Harus SETELAH app.js -->
<script src="fitur_laporan_harian.js?v=1.0"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</body>
</html>
